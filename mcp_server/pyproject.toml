[project]
name = "mcp-server"
version = "1.1.0"
description = "Graphiti MCP Server"
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "mcp>=1.27.2,<2",
    "openai>=2.41.0",
    "graphiti-core[falkordb]>=0.30.1",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.3",
    "typing-extensions>=4.0.0",
    "uvicorn>=0.34.3",
    "starlette>=0.37.0",
]

[tool.uv]
# Pin redis below 8.1.0 — falkordb is incompatible with it and the server cannot start.
#
# falkordb 1.6.2 (latest as of 2026-07) declares `redis>=7.1.0` with no upper bound, but
# FalkorDB.__init__ -> Is_Cluster() builds a *sync* redis.Redis(**kwargs) from the async
# connection's connection_kwargs. redis 8.1.0 added `himport_registry` to those kwargs,
# and sync Redis.__init__ rejects it:
#     TypeError: Redis.__init__() got an unexpected keyword argument 'himport_registry'
# This raises during driver construction, so the MCP server dies at startup before
# serving anything — it is not a degraded mode, it is a hard failure.
#
# Why this is easy to miss: the image build re-resolves dependencies
# (`rm -f uv.lock && uv lock` in Dockerfile.gemini), so the outcome depends on the build
# date. graphiti-custom v1.4.1, built 2026-07-29, resolved redis 8.0.1 and works; the
# same source rebuilt after 8.1.0's release resolves 8.1.0 and does not. The committed
# root uv.lock masks it for local development (redis 7.1.0 there).
#
# constraint-dependencies (not a direct dependency) because redis is transitive:
# mcp_server -> graphiti-core[falkordb] -> falkordb -> redis.
#
# REMOVE THIS once falkordb ships a release compatible with redis >= 8.1.0.
constraint-dependencies = ["redis<8.1"]

[project.optional-dependencies]
azure = [
    "azure-identity>=1.25.3",
]
providers = [
    "google-genai>=2.8.0",
    "anthropic>=0.107.1",
    "groq>=1.2.0",
    "voyageai>=0.3.7",
    "sentence-transformers>=3.2.1",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Required by Pydantic on Python < 3.12
"typing.TypedDict".msg = "Use typing_extensions.TypedDict instead."

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[dependency-groups]
dev = [
    "faker>=40.21.0",
    "httpx>=0.28.1",
    "psutil>=7.1.2",
    "pyright>=1.1.408",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.16",
]
